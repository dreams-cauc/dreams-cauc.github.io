<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="个人主页">
<title>dreams-cauc</title>
<style>
  :root{
    --bg:#070a13;
    --bg-2:#0c1120;
    --card:rgba(255,255,255,.03);
    --text:#e8ecf4;
    --muted:#93a0b8;
    --accent:#5b8cff;
    --accent-2:#9a5cff;
    --accent-3:#22d3ee;
    --border:rgba(148,163,184,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
  ::selection{background:rgba(91,140,255,.35)}

  .bg-grid{
    position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:
      linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 75%);
  }
  .glow{position:fixed;z-index:-1;border-radius:50%;filter:blur(120px);opacity:.35;pointer-events:none}
  .glow-1{width:520px;height:520px;background:#3b6cff;top:-180px;left:-120px}
  .glow-2{width:460px;height:460px;background:#8b3cff;top:30%;right:-160px}
  .glow-3{width:380px;height:380px;background:#17b6d9;bottom:-140px;left:30%}

  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:rgba(7,10,19,.72);
    border-bottom:1px solid var(--border);
  }
  .nav{
    max-width:1120px;margin:0 auto;padding:0 24px;
    height:64px;display:flex;align-items:center;justify-content:space-between;
  }
  .logo{
    font-weight:900;font-size:20px;letter-spacing:.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .nav-links{display:flex;gap:26px;align-items:center}
  .nav-links a{font-size:14px;color:var(--muted);transition:color .25s}
  .nav-links a:hover{color:var(--text)}

  main{flex:1;display:flex;align-items:center}
  .container{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

  .hero{padding:120px 0 80px;text-align:center}
  .avatar{
    width:108px;height:108px;margin:0 auto 28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2) 55%,var(--accent-3));
    box-shadow:0 0 0 6px rgba(91,140,255,.15),0 18px 50px rgba(91,140,255,.35);
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .hero h1{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:1px;margin-bottom:14px}
  .welcome{
    font-size:clamp(16px,2.6vw,21px);color:var(--muted);font-weight:400;margin-bottom:18px;
  }
  .welcome em{
    font-style:normal;
    background:linear-gradient(135deg,var(--accent),var(--accent-2),var(--accent-3));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero .bio{
    max-width:620px;margin:0 auto 34px;color:var(--muted);font-size:16px;
  }

  .coming-soon{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 30px;border-radius:14px;
    border:1px dashed rgba(91,140,255,.45);
    background:rgba(91,140,255,.06);
    color:var(--text);font-size:16px;font-weight:500;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent-3);
    box-shadow:0 0 0 0 rgba(34,211,238,.5);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}
    70%{box-shadow:0 0 0 10px rgba(34,211,238,0)}
    100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}
  }

  footer{
    border-top:1px solid var(--border);padding:26px 0;text-align:center;
    color:var(--muted);font-size:13px;
  }
  footer a{color:var(--accent)}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
  .reveal.in{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header>
  <nav class="nav">
    <a href="#" class="logo">dreams-cauc</a>
    <div class="nav-links">
      <a href="#">首页</a>
    </div>
  </nav>
</header>

<main>
  <div class="container">
    <section class="hero reveal">
      <div class="avatar">梦</div>
      <h1>dreams-cauc</h1>
      <div class="welcome"><em>欢迎来到 dreams-cauc 的主页</em></div>
      <p class="bio">一位编程爱好者，发现更多有趣的内容！</p>
      <div class="coming-soon"><span class="dot"></span>更多内容敬请期待！</div>
    </section>
  </div>
</main>

<footer>
  <div class="container">© 2026 <a href="https://github.com/dreams-cauc">dreams-cauc</a> · 感谢 <a href="https://github.com">GitHub</a> 提供技术服务</div>
</footer>

<script>
  window.addEventListener('load', function(){
    document.querySelector('.reveal').classList.add('in');
  });
</script>
</body>
</html>
